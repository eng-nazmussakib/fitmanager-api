# Local infrastructure for running the API the way it runs on a server (npm run dev needs none of this):
#   docker compose up -d            # PostgreSQL 18, Redis, Mailpit (catches all mail: http://localhost:8025)
#   cp .env.example .env.local      # then point it at these, e.g.:
#     NODE_ENV=development DB_DRIVER=pg DATABASE_URL=postgres://skeleton:skeleton@localhost:5432/skeleton
#     REDIS_URL=redis://localhost:6379 SMTP_URL=smtp://localhost:1025 JWT_SECRET=dev-...
#   npm run db:seed && npm run dev
services:
  postgres:
    image: postgres:18-alpine
    environment: { POSTGRES_USER: skeleton, POSTGRES_PASSWORD: skeleton, POSTGRES_DB: skeleton }
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck: { test: ['CMD', 'pg_isready', '-U', 'skeleton'], interval: 5s, retries: 10 }
  redis:
    image: redis:8-alpine
    ports: ['6379:6379']
  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']
volumes:
  pgdata:
